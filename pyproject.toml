[project]
name = "tweakify"
version = "1.2.0"
description = "A PySide6 Windows tuning dashboard with staged review, diagnostics, and portable packaging."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "PySide6>=6.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-qt>=4.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
